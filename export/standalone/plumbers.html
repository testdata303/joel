color:rgba(255,255,255,.82);font-weight:600;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}\n\n  /* faq */\n  .faq{padding:72px 0 84px;}\n  .faq-list{max-width:760px;margin:0 auto;}\n  .faq-q{border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden;background:#fff;}\n  .faq-q summary{list-style:none;cursor:pointer;padding:20px 22px;font-weight:700;font-size:1.04rem;display:flex;align-items:center;justify-content:space-between;gap:14px;}\n  .faq-q summary::-webkit-details-marker{display:none;}\n  .faq-q summary .ic{width:22px;height:22px;color:var(--accent);flex-shrink:0;transition:transform .2s;}\n  .faq-q[open] summary .ic{transform:rotate(45deg);}\n  .faq-q .ans{padding:0 22px 20px;color:var(--body);font-size:.99rem;line-height:1.6;}\n\n  footer{padding-bottom:96px;}\n\n  /* sticky mobile CTA */\n  \n\n  @media(max-width:980px){\n    .steps{grid-template-columns:repeat(2,1fr);}\n    .features{grid-template-columns:repeat(2,1fr);}\n  }\n  @media(max-width:880px){\n    .hero-grid{grid-template-columns:1fr;gap:36px;}\n    .hero{padding:40px 0 48px;}\n    .hero-sub{max-width:none;}\n    .shot .route .arr{display:none;}\n    .shot .route{gap:14px;}\n    .shot .route .rt{min-width:0;}\n    .features,.ba{grid-template-columns:1fr;}\n    .menu-ex ul{grid-template-columns:1fr;}\n    .strip-inner{gap:18px;font-size:.88rem;}\n    .sticky-cta{display:flex;}\n    .cmp-row{grid-template-columns:1fr;}\n    .cmp-row .desc{border-left:none;border-top:1px solid var(--line);}\n    .cmp-row.head{display:none;}\n    footer{padding-bottom:96px;}\n  }\n  @media(max-width:560px){\n    .steps{grid-template-columns:1fr;}\n    .flow-foot{grid-template-columns:1fr;}\n    .flow-foot div + div{border-left:none;border-top:1px solid var(--line);}\n    .frow .dest{font-size:.85rem;}\n    .closer-card{padding:48px 26px;}\n  }\n<\u002Fstyle>\n\n<style id=\"dc-semantic2\">\n@media(min-width:621px){\n  .frow .fk{background:#F3F4F6;color:#374151;}\n  .frow .fk.zero{background:#374151;color:#fff;}\n  .frow .dest{color:var(--ink);}\n}\n<\u002Fstyle>\n<style id=\"route-fn\">\n/* shot-card routes: hero function-list convention - icon tile per function, digit key only for the actual keypress */\n.route{align-items:center;}\n.route .fic{width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;flex:none;font-weight:800;font-size:1rem;color:var(--ink);}\n.route .fic svg{width:18px;height:18px;color:var(--ink);}\n.route .arr{display:none;}\n.route-tree{margin:0;padding:0;}\n.route-tree::before,.route::before,.route:last-child::after{display:none;}\n/* consistent at ALL widths: gray keys, function-colored destinations (not link-blue) */\n.frow .fk{background:#F3F4F6;color:#374151;}\n.frow .fk.zero{background:#374151;color:#fff;}\n.frow .dest{color:var(--c,var(--ink));}\n.route .fic.key{grid-auto-rows:min-content;row-gap:1px;font-size:.9rem;border-bottom-width:2.5px;border-radius:9px;}\n.route .fic.key::after{content:'press';font-size:.4rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:800;line-height:1;}\n.frow .fk{grid-auto-rows:min-content;row-gap:1px;}\n.frow .fk::after{content:'press';font-size:.44rem;letter-spacing:.09em;text-transform:uppercase;font-weight:800;line-height:1;opacity:.7;}\n.frow .fk.ext::after{content:'dial';}\n.frow .fk.ah::after{content:none;}\n<\u002Fstyle>\n<script type=\"application/ld+json\">\n{\"@context\":\"https://schema.org\",\"@type\":\"BreadcrumbList\",\"itemListElement\":[\n{\"@type\":\"ListItem\",\"position\":1,\"name\":\"Numberline\",\"item\":\"https://numberline.com/\"},\n{\"@type\":\"ListItem\",\"position\":2,\"name\":\"Industries\",\"item\":\"https://numberline.com/for\"},\n{\"@type\":\"ListItem\",\"position\":3,\"name\":\"Plumbers\",\"item\":\"https://numberline.com/for/plumbers\"}]}\n<\u002Fscript>\n<script type=\"application/ld+json\">\n{\"@context\":\"https://schema.org\",\"@type\":\"FAQPage\",\"mainEntity\":[\n{\"@type\":\"Question\",\"name\":\"Can I use my existing plumbing business number?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Numberline is designed to support bringing your current business number. Join early access and we'll share porting details when setup opens.\"}},\n{\"@type\":\"Question\",\"name\":\"Can calls ring my cell phone?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes. You can forward calls to your cell, an admin's mobile, an existing business phone, or the outside answering provider you choose, and several cell phones can ring at once. Your personal number stays private because customers only ever see the business number.\"}},\n{\"@type\":\"Question\",\"name\":\"Can I send and receive texts from the business number?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes. Texts to the business number land in one shared inbox. The team can read and reply from the same place, so a customer message never gets stuck on one person's phone.\"}},\n{\"@type\":\"Question\",\"name\":\"Can different types of calls go to different people?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Yes. Set up a simple menu and route each option however you like. New jobs can ring the owner and office, emergencies can ring the owner and a backup plumber, and existing customers can ring the dispatcher.\"}},\n{\"@type\":\"Question\",\"name\":\"What happens if nobody answers?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"The call goes to voicemail. You get a transcript and an email, and a missed-call alert helps the owner, office, or on-call person follow up. If your team uses Slack, Numberline can send notifications there too.\"}},\n{\"@type\":\"Question\",\"name\":\"Is Numberline dispatch software?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"No. Numberline is your phone system. It helps calls and texts reach the right person. It does not schedule jobs, assign technicians, or manage invoices.\"}},\n{\"@type\":\"Question\",\"name\":\"Do we need new phones or equipment?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"No. Calls forward to the cell phones your crew already carry. There is nothing to buy or install. Compatible desk phones are optional later, never required.\"}},\n{\"@type\":\"Question\",\"name\":\"What happens when we add another plumber?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Add an extension, invite them, and route emergencies or new jobs to their cell. The number your customers call never changes.\"}},\n{\"@type\":\"Question\",\"name\":\"Is there a contract?\",\"acceptedAnswer\":{\"@type\":\"Answer\",\"text\":\"Numberline is launching soon. Join early access and we'll send details on pricing, setup, and availability before public launch.\"}}]}\n<\u002Fscript>\n<style id=\"tree\">\n.shot-top .tg{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted);white-space:nowrap;}\n.route .fic:not(.key){background:var(--cs,#fff);}\n.route .fic:not(.key) svg{color:var(--c,var(--ink));}\n.rings{position:relative;margin-left:17px;padding-left:26px;}\n.rings::before{content:'';position:absolute;left:0;top:-2px;bottom:24px;width:2px;background:#D6DAE2;border-radius:2px;}\n.rings > *{position:relative;border-top:none!important;}\n.rings > *::before{content:'';position:absolute;left:-26px;top:50%;width:24px;height:2px;background:#D6DAE2;border-radius:2px;}\n.rings > :last-child::after{content:'';position:absolute;left:-27px;top:calc(50% + 1px);bottom:-6px;width:4px;background:#fff;}\n<\u002Fstyle>\n<style>/* ============================================================\n   CANON - canonical component layer.\n   Loaded LAST on every page (after each page's inline <style>),\n   so rules here WIN and apply site-wide. To change a shared\n   component everywhere, edit it HERE - one file, whole site.\n   ============================================================ */\n\n/* --- Brand safety: logo + primary CTA never turn blue on hover --- */\n/* --- Nav logo: identical size on every page (homepage was smaller) --- */\n.logo,.logo:hover,.logo:focus{color:var(--ink);}\nnav .logo{font-size:1.72rem;}\n.btn-primary:hover,.nav-cta:hover{background:var(--cta-dark);border-color:var(--cta-dark);color:#fff;}\n\n/* --- Function / feature icon tiles: ONE branded tile (soft blue fill,\n       blue glyph, no colored border). Colour lives in the tile, not borders. --- */\n.fcard .fic{background:var(--cta-soft);border:0;color:var(--cta);}\n.fcard .fic svg{color:var(--cta);}\n\n/* --- Cards & pills: borders are ALWAYS neutral --- */\n.hsteps.grid .hstep{border-color:var(--line);}\n.fchip.pro{border-color:var(--line);background:#F1F1F0;}\n.pillset .pill{border-color:var(--line);}\n\n/* --- Example-setup / routing card: keypad keys use the pastel function\n       palette (blue digits, yellow extensions, neutral operator); destination\n       is one ink chip. Wins over legacy gray-key override blocks. --- */\n.frow .fk{background:var(--cta-soft);color:var(--cta);}\n.frow .fk.ext{background:#FBF3BF;color:#6E5600;}\n.frow .fk.zero{background:var(--soft);color:var(--ink);}\n.frow .dest{color:var(--ink);font-weight:700;}\n\n/* --- Hero shot-card routing rows: icon tiles carry the pastel FUNCTION\n       colour (blue digit, purple forward, green voicemail, cyan SMS) instead\n       of flat white tiles - the same function palette as everywhere else.\n       Each .route row sets --c/--cs via its .fn-* class. --- */\n.route .fic{background:var(--cs,var(--soft));border:0;color:var(--c,var(--ink));}\n.route .fic svg{color:var(--c,var(--ink));}\n\n/* --- Greeting bands: readable ink text (was gray-on-gray) --- */\n.shot-greet,.flow-greet{color:var(--ink);}\n.shot-greet small{color:var(--body);}\n\n/* --- Comparison tables: the winning row/column is ALWAYS legible --- */\n.cmp-row.joel .desc{color:rgba(255,255,255,.86);}\n.cmp-row.joel .desc a{color:#fff;text-decoration-color:rgba(255,255,255,.5);}\n.cmp-row .jl{color:var(--ink);}\n.cmp4-row.joel .cell{color:rgba(255,255,255,.86);}\n.cmp4-row.joel .lbl{color:rgba(255,255,255,.6);}\n\n/* --- Section eyebrow: identical blue chip everywhere --- */\n.sec-kicker,.kicker,.jx-kicker{color:var(--cta-dark);background:var(--cta-soft);border-radius:8px;}\n\n/* --- Mobile: the standalone nav CTA wraps to two lines - hide it.\n       The same link stays available inside the hamburger menu. --- */\n@media(max-width:860px){.nav-cta-m{display:none;}}\n\n/* --- Hero band: the homepage's soft coloured wash, applied to every hero\n       (contained gradient - no overflow, works regardless of markup) --- */\n.hero,.jx-hero{background:radial-gradient(120% 92% at 92% -12%,rgba(37,64,238,.10),transparent 58%),radial-gradient(82% 74% at -12% 112%,rgba(162,251,239,.15),transparent 60%),var(--paper);}\n\n/* --- Industry (/for/) pages carry class=\"lp\" on <body>. The intro\n       paragraphs under the hero read left-aligned; headings and the\n       closer stay centred. Applies to current and future /for/ pages. --- */\nbody.lp .pain-copy{text-align:left;}\n\n/* --- Shot card header: the \"No per-user pricing\" stamp overlaps the\n       top-right corner, so the title row must never run under it. Reserve\n       the corner and drop the Live badge - the title is enough. --- */\nbody.lp .shot-top{padding-right:152px;min-height:52px;}\nbody.lp .shot-top .badge{display:none;}\n\n/* --- Closer card small print: was white-on-white on the light card --- */\nbody.lp .closer-mini{color:var(--muted);}\n\n/* --- Lighter brand (700): wordmark echoes match the lockup --- */\n.cmp-row.joel .opt,.cmp4-row.joel .opt{font-weight:700;letter-spacing:.015em;}\n.nup-stamp{font-weight:700;}\n<\u002Fstyle>\n<\u002Fhead>\n<body class=\"lp\">\n\n<nav>\n  <div class=\"wrap nav-inner\">\n    <a href=\"/index.html\" class=\"logo\" aria-label=\"Numberline home\"><span class=\"lmark\"><span class=\"lmr\"><i><\u002Fi><i><\u002Fi><\u002Fspan><\u002Fspan><span class=\"lw\">NUMBERLINE<\u002Fspan><\u002Fa>\n    <a href=\"/early-access.html\" class=\"nav-cta nav-cta-m\">Get early access<\u002Fa>\n    <button class=\"hamburger\" id=\"hb\" aria-label=\"Menu\" aria-expanded=\"false\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M3 6h18M3 12h18M3 18h18\"><\u002Fpath><\u002Fsvg>\n    <\u002Fbutton>\n    <div class=\"nav-links\" id=\"navlinks\">\n      <a href=\"/how-it-works.html\">How it works<\u002Fa>\n      <a href=\"/features.html\">Features<\u002Fa>\n      <a href=\"/pricing.html\">Pricing<\u002Fa>\n      <a href=\"/signin.html\">Sign in<\u002Fa>\n      <a href=\"/early-access.html\" class=\"nav-cta\">Get early access<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fnav>\n\n<!-- 1. HERO -->\n<section class=\"hero\" data-screen-label=\"Hero\">\n  <div class=\"wrap hero-grid\">\n    <div class=\"hero-copy reveal\">\n      <div class=\"hero-kick\"><span class=\"eyebrow\">Phone system for plumbers<\u002Fspan>\n      \n      <\u002Fdiv>\n      <h1>The plumbing phone system for <span class=\"u\">job calls, texts, and follow-up.<\u002Fspan><\u002Fh1>\n      <p class=\"hero-sub\">Numberline gives your plumbing business a local or toll-free business line, call forwarding, shared texts, voicemail transcripts, and after-hours options, so new jobs, existing customers, leak photos, and follow-up stay with the business.<\u002Fp>\n      <div class=\"hero-acts\">\n        <a href=\"#how\" class=\"btn btn-ghost btn-lg\">See how it works<\u002Fa>\n        <a href=\"/early-access.html\" class=\"btn btn-primary btn-lg btn-arrow\">Get early access <span class=\"btn-guillemet\" aria-hidden=\"true\">»<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n      <ul class=\"hero-bullets\">\n        <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>A business line for your website, trucks, ads, and invoices<\u002Fli>\n        <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>Forward calls to the owner, office, dispatcher, or on-call plumber<\u002Fli>\n        <li><span class=\"ck\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>Keep texts, leak photos, voicemails, and follow-up with the business<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <!-- [PRODUCT SCREENSHOT: routing setup or inbox] -->\n    <div class=\"shot reveal\" role=\"img\" aria-label=\"Sample plumbing phone setup: an emergency call rings the on-call plumber, texts and voicemails go to the shared inbox, and after-hours calls forward to an answering service\">\n      <span class=\"nup-stamp nup-lg shot-stamp\" role=\"img\" aria-label=\"No per-user pricing\">No per-user<span class=\"nup-l2\">pricing!<\u002Fspan><\u002Fspan>\n      <div class=\"shot-top\">\n        <b>Sample plumbing phone setup<\u002Fb>\n        <span class=\"tg\">Sample setup<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"shot-body\">\n        <div class=\"shot-greet\"><small>Callers hear your greeting<\u002Fsmall>Thanks for calling Metro Plumbing. Press 1 for new jobs, 2 for existing customers, 3 for an emergency, or 0 for the owner.<\u002Fdiv>\n        <div class=\"rings\">\n        <div class=\"route fn-number\"><span class=\"fic key\">3<\u002Fspan><div class=\"rt\"><b>They press 3, emergency<\u002Fb><span>Water is coming through the kitchen ceiling<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"route fn-fwd\"><span class=\"fic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z\"><\u002Fpath><\u002Fsvg><\u002Fspan><div class=\"rt\"><b>Mike's cell rings<\u002Fb><span>The on-call plumber, wherever he is<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"route fn-sms\"><span class=\"fic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"><\u002Fpath><\u002Fsvg><\u002Fspan><div class=\"rt\"><b>Texts / Voicemails<\u002Fb><span>Sent to shared inbox, email, or Slack<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <div class=\"route fn-ai\"><span class=\"fic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z\"><\u002Fpath><\u002Fsvg><\u002Fspan><div class=\"rt\"><b>After hours<\u002Fb><span>Forward to a third-party answering service<\u002Fspan><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"shot-ah\"><span class=\"shot-ah-badge\">After-hours routing<\u002Fspan><span class=\"shot-ah-tx\">Forward after-hours job calls or overflow calls to your own answering provider or <a href=\"/learn/bring-your-own-ai.html\" style=\"color:var(--ai,#BE185D);font-weight:700;\">the third-party AI answering service you choose<\u002Fa>. Numberline keeps the business line and routes the call.<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- TRUST STRIP -->\n<div class=\"strip\">\n  <div class=\"wrap strip-inner\">\n    <span><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2L3 14h9l-1 8 10-12h-9z\"><\u002Fpath><\u002Fsvg> Simple setup<\u002Fspan>\n    <span><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"><\u002Fpath><\u002Fsvg> Built for small teams<\u002Fspan>\n    <span><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z\"><\u002Fpath><\u002Fsvg> Keep your cell private<\u002Fspan>\n    <span><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z\"><\u002Fpath><path d=\"M9 22V12h6v10\"><\u002Fpath><\u002Fsvg> No hardware to buy<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- 2. PAIN -->\n<section class=\"block pain\" data-screen-label=\"Pain\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <h2>Plumbing communication is more than answering the next call.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"pain-copy reveal\">\n      <p>A plumbing business gets new job calls, emergency calls, existing customer calls, billing questions, leak photos, and after-hours messages. <b>If all of that runs through the owner's cell, the business becomes hard to organize.<\u002Fb> Numberline gives the company a line, shared messages, voicemail transcripts, and routing that can grow beyond one person.<\u002Fp>\n      \n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 3. HOW IT WORKS -->\n<section class=\"block steps-wrap\" id=\"how\" data-screen-label=\"How it works\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <h2>Here's how a plumbing company sets it up.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"fnlist-card grid reveal\">\n<ol class=\"hsteps grid\">\n        <li class=\"hstep fn-number\">\n          <div class=\"hstep-body\">\n            <div class=\"hstep-title\"><span class=\"hstep-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 9h16M4 15h16M10 3 8 21M16 3 14 21\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Get a number<\u002Fb><\u002Fdiv>\n            <div class=\"hstep-flow\"><span class=\"hstep-out\"><span class=\"hstep-res\">Toll-free or local<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fli>\n        <li class=\"hstep fn-ext\">\n          <div class=\"hstep-body\">\n            <div class=\"hstep-title\"><span class=\"hstep-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"6\" cy=\"6\" r=\"2.5\"><\u002Fcircle><circle cx=\"18\" cy=\"6\" r=\"2.5\"><\u002Fcircle><circle cx=\"12\" cy=\"18\" r=\"2.5\"><\u002Fcircle><path d=\"M6 8.5v3a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-3M12 13.5v2\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Create extensions<\u002Fb><\u002Fdiv>\n            <div class=\"hstep-flow\"><span class=\"hstep-out\"><span class=\"hstep-res\">Departments/team<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fli>\n        <li class=\"hstep fn-fwd\">\n          <div class=\"hstep-body\">\n            <div class=\"hstep-title\"><span class=\"hstep-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Forward calls<\u002Fb><\u002Fdiv>\n            <div class=\"hstep-flow\"><span class=\"hstep-out\"><span class=\"hstep-res\">Route to mobile<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fli>\n        <li class=\"hstep fn-vm\">\n          <div class=\"hstep-body\">\n            <div class=\"hstep-title\"><span class=\"hstep-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"6\" cy=\"12\" r=\"4\"><\u002Fcircle><circle cx=\"18\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M6 16h12\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Get voicemails<\u002Fb><\u002Fdiv>\n            <div class=\"hstep-flow\"><span class=\"hstep-out\"><span class=\"hstep-res\">Email or the right person<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fli>\n        <li class=\"hstep fn-sms\">\n          <div class=\"hstep-body\">\n            <div class=\"hstep-title\"><span class=\"hstep-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Manage shared texts<\u002Fb><\u002Fdiv>\n            <div class=\"hstep-flow\"><span class=\"hstep-out\"><span class=\"hstep-res\">Team inbox<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fli>\n        <li class=\"hstep fn-ai\">\n          <div class=\"hstep-body\">\n            <div class=\"hstep-title\"><span class=\"hstep-ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M13 2 4 14h6l-1 8 9-12h-6z\"><\u002Fpath><\u002Fsvg><\u002Fspan><b>Add integrations<\u002Fb><\u002Fdiv>\n            <div class=\"hstep-flow\"><span class=\"hstep-out\"><span class=\"hstep-res\">Third-party tools<\u002Fspan><\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n\n    <div class=\"sec-head reveal\" style=\"margin-top:56px;\">\n      <h2>Where each call goes.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"flow reveal\">\n      <div class=\"flow-top\"><div class=\"mn\"><small>Sample plumbing setup<\u002Fsmall><b>(415) 555-0134<\u002Fb><\u002Fdiv><div class=\"biz\">Metro Plumbing<\u002Fdiv><\u002Fdiv>\n      <div class=\"flow-greet\">\"Thanks for calling Metro Plumbing. Press 1 for new jobs, 2 for existing customers, 3 for an emergency, or 0 for the owner.\"<\u002Fdiv>\n      <div class=\"flow-rows\">\n        <div class=\"frow fn-fwd\"><span class=\"fk\">1<\u002Fspan><div class=\"fl\"><b>New jobs<\u002Fb><span>Estimate requests<\u002Fspan><\u002Fdiv><span class=\"dest\">Owner's + office mobiles<\u002Fspan><\u002Fdiv>\n        <div class=\"frow fn-fwd\"><span class=\"fk\">2<\u002Fspan><div class=\"fl\"><b>Existing customers<\u002Fb><span>Scheduled work, questions<\u002Fspan><\u002Fdiv><span class=\"dest\">Dispatcher's mobile<\u002Fspan><\u002Fdiv>\n        <div class=\"frow fn-fwd\"><span class=\"fk\">3<\u002Fspan><div class=\"fl\"><b>Emergencies<\u002Fb><span>Water through the ceiling<\u002Fspan><\u002Fdiv><span class=\"dest\">On-call plumber's cell<\u002Fspan><\u002Fdiv>\n        <div class=\"frow fn-fwd\"><span class=\"fk zero\">0<\u002Fspan><div class=\"fl\"><b>The owner<\u002Fb><span>Direct line<\u002Fspan><\u002Fdiv><span class=\"dest\">Owner's mobile<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"flow-foot\">\n        <div><b>After hours<\u002Fb>Job calls forward to your answering provider or the third-party AI answering service you choose.<\u002Fdiv>\n        <div><b>Nobody answers?<\u002Fb>Voicemail becomes a transcript in the shared inbox, and whoever is free calls back from the business number.<\u002Fdiv>\n        <div><b>Texts<\u002Fb>Leak photos and messages land in the shared inbox for the whole crew.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 4. FEATURES -->\n<section class=\"block\" data-screen-label=\"Features\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <h2>Everything a plumbing business needs from a phone.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"features\">\n\n      <div class=\"fcard reveal\">\n        <div class=\"fic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Business number<\u002Fh3>\n        <p>Get a new number for your service area or port the one your customers already have. It becomes the single number for the whole business.<\u002Fp>\n        <div class=\"eg\"><b>Example<\u002Fb>Put one number on the truck, the yard sign, and the invoices instead of your personal cell.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"fcard reveal\">\n        <div class=\"fic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12h18M3 6h18M3 18h18\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Simple call routing<\u002Fh3>\n        <p>Set up a short menu and point each option at the right person. Callers choose what they need and the call goes straight there.<\u002Fp>\n        <div class=\"eg\"><b>Example<\u002Fb>Press 1 for new jobs, press 3 for an emergency, press 0 for the owner.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"fcard reveal\">\n        <div class=\"fic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Shared text messages<\u002Fh3>\n        <p>Texts to the business number land in one shared inbox. Anyone on the team can read and reply, so messages don't get stuck on one phone.<\u002Fp>\n        <div class=\"eg\"><b>Example<\u002Fb>A customer texts a photo of a leak and whoever is free replies from the shared inbox.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"fcard reveal\">\n        <div class=\"fic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 4h16c1 0 2 .9 2 2v12c0 1.1-1 2-2 2H4c-1 0-2-.9-2-2V6c0-1.1 1-2 2-2z\"><\u002Fpath><path d=\"m22 7-10 5L2 7\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Voicemail and transcripts<\u002Fh3>\n        <p>When nobody answers, the call goes to voicemail. You get the message as a transcript and an email so you can read it and call back.<\u002Fp>\n        <div class=\"eg\"><b>Example<\u002Fb>Read the voicemail transcript between jobs instead of stopping to listen to it.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"fcard reveal\">\n        <div class=\"fic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z\"><\u002Fpath><path d=\"M14 2v6h6\"><\u002Fpath><path d=\"M9 13l2 2 4-4\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Missed-call and voicemail alerts<\u002Fh3>\n        <p>When nobody answers, Numberline can send a missed-call alert and voicemail transcript so the owner, office, or on-call person knows to follow up. If your team uses Slack, Numberline can send notifications there too.<\u002Fp>\n        <div class=\"eg\"><b>Example<\u002Fb>A missed emergency call sends an alert and the on-call plumber calls the customer back fast.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"fcard reveal\">\n        <div class=\"fic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2\"><\u002Fpath><circle cx=\"9\" cy=\"7\" r=\"4\"><\u002Fcircle><path d=\"M23 21v-2a4 4 0 0 0-3-3.87\"><\u002Fpath><path d=\"M16 3.13a4 4 0 0 1 0 7.75\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <h3>Overflow or after-hours answering<\u002Fh3>\n        <p>Route overflow or after-hours calls to a third-party answering service you choose, and change it when you need to. Connect it, switch providers, or turn it off without changing your number.<\u002Fp>\n        <div class=\"eg\"><b>Example<\u002Fb>Send after-hours calls to a third-party answering service you choose, and back to the on-call plumber in the morning.<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 5. BEFORE / AFTER -->\n<section class=\"block\" data-screen-label=\"Before and after\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <h2>From one phone in a pocket to a real phone system.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"ba\">\n      <div class=\"ba-col ba-before reveal\">\n        <span class=\"tag\">Before Numberline<\u002Fspan>\n        <h3>Everything on the owner's cell<\u002Fh3>\n        <ul>\n          <li><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fspan>Calls go to the owner's personal cell<\u002Fli>\n          <li><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fspan>Texts are scattered across phones<\u002Fli>\n          <li><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fspan>Missed calls just disappear<\u002Fli>\n          <li><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fspan>Customers don't know who to call<\u002Fli>\n          <li><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg><\u002Fspan>Adding help creates more phone chaos<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div class=\"ba-col ba-after reveal\">\n        <span class=\"tag\">After Numberline<\u002Fspan>\n        <h3>A business line, routed by function<\u002Fh3>\n        <ul>\n          <li><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>A business line for the whole company<\u002Fli>\n          <li><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>Calls route by function<\u002Fli>\n          <li><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>Texts stay with the business<\u002Fli>\n          <li><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>Missed calls create notifications<\u002Fli>\n          <li><span class=\"ic\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fspan>Assistants, dispatchers, and plumbers can help without owning the customer relationship<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n\n<!-- 7. COMPARISON -->\n<section class=\"block compare-green\" data-screen-label=\"Comparison\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <h2>How Numberline compares for a plumbing business.<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"cmp reveal\">\n      <div class=\"cmp-row head\"><div class=\"opt\">Option<\u002Fdiv><div class=\"desc\">What it means for a plumbing business<\u002Fdiv><\u002Fdiv>\n      <div class=\"cmp-row\"><div class=\"opt\">Personal cell phone<\u002Fdiv><div class=\"desc\">Free and familiar, but every call hits one phone, your number is out there for good, and there is no menu, no shared texts, and no way to route a job to someone else.<\u002Fdiv><\u002Fdiv>\n      <div class=\"cmp-row\"><div class=\"opt\">Google Voice<\u002Fdiv><div class=\"desc\">Gives you a second number, but it is built for one person. There is no menu to route new jobs, emergencies, and existing customers to different people, and no shared inbox for the team.<\u002Fdiv><\u002Fdiv>\n      <div class=\"cmp-row\"><div class=\"opt\">Enterprise phone systems<\u002Fdiv><div class=\"desc\">They really can do a lot: integrations, AI features, deep routing. But they come with per-seat pricing, contracts, and an admin console built for big call centers. Most plumbing businesses spend more time fighting the setup than using it.<\u002Fdiv><\u002Fdiv>\n      <div class=\"cmp-row\"><div class=\"opt\">AI answering services<\u002Fdiv><div class=\"desc\">Great when nobody can pick up. With Numberline you don't have to replace your phone system to use one: route new jobs, emergencies, or after-hours calls to the <a href=\"/learn/bring-your-own-ai.html\" style=\"color:var(--accent-dark);font-weight:700;\">third-party AI answering service you choose<\u002Fa>.<\u002Fdiv><\u002Fdiv>\n      <div class=\"cmp-row best\"><div class=\"opt\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"width:18px;height:18px\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg> Numberline<\u002Fdiv><div class=\"desc\">Numberline gives the business a local or toll-free line, call forwarding, shared texts and voicemails, voicemail transcripts, callbacks from the business number, and room to add extensions, teammates, locations, or third-party answering services when needed.<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"max-width:900px;margin:26px auto 0;text-align:center;color:var(--muted);font-weight:600;font-size:.95rem;\">Related reading: <a href=\"/features/call-forwarding.html\" style=\"color:var(--accent-dark);font-weight:700;\">call forwarding<\u002Fa>, <a href=\"/use-cases/ring-multiple-cell-phones.html\" style=\"color:var(--accent-dark);font-weight:700;\">a business phone that rings multiple cell phones<\u002Fa>, <a href=\"/learn/business-phone-number.html\" style=\"color:var(--accent-dark);font-weight:700;\">business phone number<\u002Fa>, and <a href=\"/learn/personal-cell-vs-business-phone-system.html\" style=\"color:var(--accent-dark);font-weight:700;\">personal cell vs business phone system<\u002Fa>.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 8. FAQ -->\n<section class=\"faq\" data-screen-label=\"FAQ\">\n  <div class=\"wrap\">\n    <div class=\"sec-head reveal\">\n      <h2>Questions plumbers ask<\u002Fh2>\n    <\u002Fdiv>\n    <div class=\"faq-list\">\n      <details class=\"faq-q\" open=\"\"><summary>Can I use my existing plumbing business number?<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary><div class=\"ans\">Numberline is designed to support bringing your current business number. Join early access and we'll share porting details when setup opens.<\u002Fdiv><\u002Fdetails>\n      <details class=\"faq-q\"><summary>Can calls ring my cell phone?<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary><div class=\"ans\">Yes. You can forward calls to your cell, an admin's mobile, an existing business phone, or the outside answering provider you choose, and <a href=\"/use-cases/ring-multiple-cell-phones.html\" style=\"color:var(--accent-dark);font-weight:700;\">several cell phones can ring at once<\u002Fa>. Your personal number stays private because customers only ever see the business number.<\u002Fdiv><\u002Fdetails>\n      <details class=\"faq-q\"><summary>Can I send and receive texts from the business number?<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary><div class=\"ans\">Yes. Texts to the business number land in one shared inbox. The team can read and reply from the same place, so a customer message never gets stuck on one person's phone.<\u002Fdiv><\u002Fdetails>\n      <details class=\"faq-q\"><summary>Can different types of calls go to different people?<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary><div class=\"ans\">Yes. Set up a simple menu and route each option however you like. New jobs can ring the owner and office, emergencies can ring the owner and a backup plumber, and existing customers can ring the dispatcher.<\u002Fdiv><\u002Fdetails>\n      <details class=\"faq-q\"><summary>What happens if nobody answers?<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary><div class=\"ans\">The call goes to voicemail. You get a transcript and an email, and a missed-call alert helps the owner, office, or on-call person follow up. If your team uses Slack, Numberline can send notifications there too.<\u002Fdiv><\u002Fdetails>\n      <details class=\"faq-q\"><summary>Is Numberline dispatch software?<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary><div class=\"ans\">No. Numberline is your phone system. It helps calls and texts reach the right person. It does not schedule jobs, assign technicians, or manage invoices.<\u002Fdiv><\u002Fdetails>\n      <details class=\"faq-q\"><summary>Do we need new phones or equipment?<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary><div class=\"ans\">No. Calls forward to the cell phones your crew already carry. There is nothing to buy or install. Compatible desk phones are optional later, never required.<\u002Fdiv><\u002Fdetails>\n      <details class=\"faq-q\"><summary>What happens when we add another plumber?<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary><div class=\"ans\">Add an extension, invite them, and route emergencies or new jobs to their cell. The number your customers call never changes.<\u002Fdiv><\u002Fdetails>\n      <details class=\"faq-q\"><summary>Is there a contract?<svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fsummary><div class=\"ans\">Numberline is launching soon. Join early access and we'll send details on pricing, setup, and availability before public launch.<\u002Fdiv><\u002Fdetails>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- 9. FINAL CTA -->\n<section class=\"closer\">\n  <div class=\"wrap\">\n    <div class=\"closer-card reveal\">\n      <span class=\"nup-stamp nup-lg\" role=\"img\" aria-label=\"No per-user pricing\">No per-user<span class=\"nup-l2\">pricing!<\u002Fspan><\u002Fspan>\n      <h2>The next emergency call should ring someone who can take it.<\u002Fh2>\n      <p>One business number on every truck, a menu that answers like a company, and emergencies routed to whoever is on call.<\u002Fp>\n      <a href=\"/early-access.html\" class=\"btn btn-primary btn-lg btn-arrow\">Get early access <span class=\"btn-guillemet\" aria-hidden=\"true\">»<\u002Fspan><\u002Fa>\n      <div class=\"closer-mini\"><span>New or ported number<\u002Fspan> · <span>Works on the phone you have<\u002Fspan> · <span>Built for small teams<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer>\n  <div class=\"wrap\">\n    <div class=\"foot-inner\">\n      <div class=\"foot-top\">\n        <div class=\"foot-brand\">\n        <a href=\"/index.html\" class=\"logo\" aria-label=\"Numberline home\"><span class=\"lmark\"><span class=\"lmr\"><i><\u002Fi><i><\u002Fi><\u002Fspan><\u002Fspan><span class=\"lw\">NUMBERLINE<\u002Fspan><\u002Fa>\n        <p>Numberline is a business number and phone system in one for startups, small businesses, and modern teams. Get a local or toll-free business number, forward calls, manage shared texts and voicemails, call back from your bu
