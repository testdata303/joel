  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Spline Sans Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"0c387cd9-278f-4537-9fd2-d4f379ca8813\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Spline Sans Mono';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"3f18407f-8203-4c09-a5eb-c7823f268fa7\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>/* ============================================================\n   JOEL - shared design system\n   One source of truth for chrome + primitives across every\n   marketing + landing page. Page-specific rules stay in-page.\n   ============================================================ */\n\n*{margin:0;padding:0;box-sizing:border-box;}\n:root{\n  --ink:#131316;--body:#4A4A52;--muted:#6E7480;--line:#E8EAEE;--line-soft:#f1f2f4;--soft:#F1F3F6;--bg:#FFFFFF;--bg-alt:#F6F6F7;--card:#fff;\n  /* Numberline brand - Ink actions + one electric accent (#A2FBEF). */\n  --neon:#A2FBEF;\n  --beige:#F4F2ED; /* Paper - warm neutral chip/section ground */\n  --cta:#5158E2;--cta-soft:#ECEDFC;--cta-dark:#3E45C7; /* Signal Blue - primary action fill */\n  --accent:#131316;--accent-dark:#33333A;--accent-soft:#F1F1F0;--accent-text:#131316;\n  --accent-ink:#3E45C7; /* accent used as TEXT or ICON - Signal Blue, never teal */\n  --accent-on-dark:#FFFFFF; /* actions reverse to white on Ink */\n  --paper:#FFFFFF;          /* white section band */\n  --wa:#1FAE63;\n  /* aliases - some pages reference these names; mapped to the canonical palette */\n  --blue:#5158E2;--blue-dark:#3E45C7;--blue-soft:#ECEDFC;--blue-ink:#3E45C7;\n  --ai:#131316;--ai-soft:#F1F1F0;--green:#1bb56a;\n  --sans:'Plus Jakarta Sans',system-ui,sans-serif;--serif:'Newsreader',Georgia,serif;\n  --display:'Figtree',var(--sans);          /* headlines + wordmark */\n  --mono:'Spline Sans Mono',ui-monospace,'SFMono-Regular',monospace; /* eyebrows / small labels */\n}\nhtml{scroll-behavior:smooth;}\n/* ============================================================\n   NO PER-USER PRICING stamp - brand mark, always this exact\n   phrase. Inline seal: double ring, slight tilt, Signal Blue.\n   Sizes: default (inline / fact strips), .nup-lg (section-level).\n   ============================================================ */\n.nup-stamp{position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:var(--display);font-weight:800;text-transform:uppercase;color:#25272E;background:#fff;border:3px solid #25272E;border-radius:50%;transform:rotate(-5deg);font-size:.62rem;letter-spacing:.1em;line-height:1.22;padding:1.28em 1.65em .92em;white-space:nowrap;user-select:none;flex-shrink:0;box-shadow:0 8px 24px rgba(19,19,22,.10);}\n.nup-stamp .nup-l2{display:block;}\n.nup-lg{font-size:.78rem;border-width:3px;}\n.closer-card .nup-stamp{margin:0 auto 22px;}\n.jx-hero .nup-stamp{margin:0 auto 26px;}\n.jx-hero:has(> .wrap > .nup-stamp){padding-top:32px;}\n.hero-copy .nup-stamp{margin:0 0 26px;}\n.nup-row{text-align:center;margin:0 0 28px;}\n.hero-note-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}\n.hero-note-row .hero-facts{display:flex;flex-wrap:wrap;column-gap:8px;row-gap:2px;line-height:1.6;flex:1;min-width:240px;}\n.hero-note-row .hero-facts span{white-space:nowrap;}\n@media(max-width:860px){.hero-note-row{justify-content:center;text-align:center;}.hero-note-row .hero-facts{justify-content:center;flex:none;}}\nbody{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5;}\n/* standardize heading line-wrapping site-wide so titles break evenly instead of orphaning a word */\nh1,h2,h3{text-wrap:pretty;}\n/* Numberline headlines - Figtree 600 (weight restraint, tight tracking). Body + UI text stay Plus Jakarta Sans. */\nh1,h2{font-family:var(--display);font-weight:600;letter-spacing:-.035em;}\n/* Brand rule: marketing headlines are ALWAYS ink - never colored. Accent lives in eyebrows, links, and function icons only. */\nh1,h2,h3,.sec-head h2,.sec-head h3{color:var(--ink);}\n/* default links - Signal Blue, never browser blue */\na{color:var(--cta);}a:hover{color:var(--cta-dark);}\n/* small labels / eyebrows - Plus Jakarta Sans 700, uppercase (per brand guidelines; no mono) */\n/* exploration: warm Paper hero band */\n.jx-hero{background:var(--paper);}\n.wrap{max-width:1140px;margin:0 auto;padding:0 32px;}\n.reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease;}\n.reveal.in{opacity:1;transform:none;}\n\n/* buttons */\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;text-decoration:none;border-radius:10px;font-size:.97rem;cursor:pointer;transition:transform .15s,background .15s;border:2px solid transparent;font-family:var(--sans);white-space:nowrap;}\n.btn:hover{transform:translateY(-1px);}\n.btn-primary{background:var(--cta);color:#fff;border-color:var(--cta);padding:13px 22px;}\n.btn-primary:hover{background:var(--cta-dark);color:#fff;border-color:var(--cta-dark);}\n.btn-secondary{background:#fff;border-color:var(--ink);color:var(--ink);padding:12px 22px;}\n.btn-secondary:hover{background:var(--ink);color:#fff;}\n.btn-white{background:#fff;color:var(--ink);padding:15px 28px;}\n.btn-lg{padding:15px 28px;font-size:1rem;}\n.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink);padding:12px 22px;}\n.btn-ghost:hover{border-color:var(--ink);}\n.btn-arrow svg{width:18px;height:18px;transition:transform .18s;}\n.btn-arrow:hover svg{transform:translateX(3px);}\n/* arrow glyph used on CTAs */\n.btn-guillemet{font-family:var(--display);font-weight:700;font-size:1.15em;line-height:1;display:inline-block;position:relative;top:.03em;margin-left:-.06em;transition:transform .18s;}\n.btn-arrow:hover .btn-guillemet{transform:translateX(3px);}\n.link-arrow{color:var(--accent-ink);text-decoration:none;font-weight:700;font-size:.9rem;}\n\n/* keep FAQ question text as a single flex item */\n.faq-q summary>.fq-text{min-width:0;}\n\n/* nav */\nnav{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);z-index:50;}\n.nav-inner{display:flex;align-items:center;justify-content:space-between;height:88px;}\n.logo{display:inline-flex;flex-direction:row;align-items:center;gap:.345em;font-family:var(--display);font-weight:700;font-size:1.45rem;letter-spacing:.015em;color:var(--ink);text-decoration:none;line-height:1;}\n.logo .lw{display:block;line-height:.9;white-space:nowrap;}\n.logo .lmark{width:1.25em;height:1.25em;display:flex;align-items:center;justify-content:center;flex:none;}\n.logo .lmr{display:flex;justify-content:space-between;align-items:flex-start;width:.9375em;border-top:.10625em solid currentColor;}\n.logo .lmr i{display:block;width:.10625em;height:.2125em;background:currentColor;}\n.logo.nomark .lmark{display:none;}\n.logo,.logo:hover,.logo:focus{color:var(--ink);}\n.logo.lg{font-size:2.1rem;}\n.nav-links{display:flex;align-items:center;gap:32px;}\n.nav-links a{color:var(--body);text-decoration:none;font-weight:600;font-size:.94rem;transition:color .18s;}\n.nav-links a:hover{color:var(--ink);}\n.nav-cta-m{display:none;}\n.nav-links a.active{color:var(--ink);font-weight:700;text-decoration:underline;text-underline-offset:7px;text-decoration-thickness:2px;text-decoration-color:var(--accent);}\n.nav-cta{background:var(--cta);color:#fff!important;padding:11px 22px;border-radius:10px;font-weight:700!important;text-decoration:none;}\n.nav-cta:hover{background:var(--cta-dark);}\n.hamburger{display:none;background:none;border:none;cursor:pointer;padding:8px;margin:-8px;color:var(--ink);}\n.hamburger svg{width:28px;height:28px;display:block;}\n@media(max-width:860px){\n  .hamburger{display:block;}\n  .nav-links{position:fixed;top:88px;left:0;right:0;background:#fff;border-bottom:1px solid var(--line);flex-direction:column;align-items:stretch;gap:0;padding:8px 0;box-shadow:0 16px 40px rgba(15,17,21,.08);transform:translateY(-12px);opacity:0;pointer-events:none;transition:opacity .2s ease,transform .2s ease;}\n  .nav-links.open{transform:none;opacity:1;pointer-events:auto;}\n  .nav-links a:not(.nav-cta){display:block!important;padding:15px 24px;font-size:1.05rem;border-bottom:1px solid var(--line);}\n  .nav-links a.nav-cta{display:none;}\n  .nav-cta-m{display:inline-flex;align-items:center;margin-left:auto;margin-right:14px;padding:9px 15px;font-size:.82rem;border-radius:9px;}\n}\n\n/* NOTE: section / .sec-head / .kicker / .closer are intentionally NOT shared -\n   pages diverge (centered vs left-aligned headers, gradient vs solid CTA).\n   Those stay page-local until a deliberate unification pass. */\n\n/* footer */\nfooter{background:var(--bg);border-top:1px solid var(--line);padding:56px 0 32px;}\n.foot-inner{display:flex;flex-direction:column;gap:44px;}\n.foot-top{display:flex;gap:56px;flex-wrap:wrap;align-items:flex-start;}\n.foot-brand{max-width:420px;flex:1;min-width:280px;}\n.foot-brand .logo{font-size:1.5rem;}\n.foot-brand p{font-family:var(--sans);color:var(--body);margin-top:10px;font-size:.95rem;font-weight:500;line-height:1.6;}\n.foot-cols{display:flex;gap:80px;flex-wrap:wrap;width:100%;padding-top:44px;border-top:1px solid var(--line);}\n.foot-col-wide .foot-links a{white-space:nowrap;}\n.foot-col-stack{display:flex;flex-direction:column;gap:28px;}\n.foot-group h5{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:14px;}\n.foot-group a{display:block;color:var(--body);text-decoration:none;font-size:.92rem;font-weight:600;margin-bottom:9px;}\n.foot-group a:hover{color:var(--ink);}\n.foot-col h5{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:14px;}\n.foot-col a{display:block;color:var(--body);text-decoration:none;font-size:.92rem;font-weight:600;margin-bottom:9px;}\n.foot-col a:hover{color:var(--ink);}\n.foot-base{margin-top:40px;padding-top:22px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem;}\n@media(max-width:620px){\n  footer{padding:40px 0 28px;}\n  .foot-inner{gap:28px;}\n  .foot-top{gap:28px;}\n  .foot-cols{gap:28px;padding-top:28px;}\n  .foot-base{margin-top:28px;}\n}\n\n\n/* ============================================================\n   BRANDED FUNCTION DESIGN - canonical way to show how Numberline works.\n   One row per function: colored icon tile + bold name + outcome chip.\n   Rows NEVER wrap to two lines. (Born on the homepage hero.)\n   Rows use black icon tiles + one accent chip (Direction C).\n   Function → color, for chips/badges where a function appears in isolation:\n     fn-number  Get a number          blue   #2454D6 / #EEF4FF\n     fn-ext     Extensions            yellow #57534E on #FEFCE8\n     fn-fwd     Forward calls         purple #611F69 / #F6F2FF\n     fn-vm      Voicemails            green  #15803D / #ECFDF3\n     fn-sms     Texts / WhatsApp      cyan   #0369A1 / #ECFEFF\n     fn-ai      Integrations / AI     pink   #BE185D / #FCE7F3\n   Markup:\n   <ol class=\"hsteps\">\n     <li class=\"hstep fn-number\"><div class=\"hstep-body\">\n       <div class=\"hstep-title\"><span class=\"hstep-ic\">SVG<\u002Fspan><b>Get a number<\u002Fb><\u002Fdiv>\n       <div class=\"hstep-flow\"><span class=\"hstep-out\"><span class=\"hstep-res\">Toll-free or local<\u002Fspan><\u002Fspan><\u002Fdiv>\n     <\u002Fdiv><\u002Fli>\n   <\u002Fol>\n   ============================================================ */\n:root{\n  --fn-number:#12308F;--fn-number-soft:#CFE0FF;--fn-number-line:#A8C4FF;\n  --fn-ext:#6B5A12;--fn-ext-soft:#FBF3C4;--fn-ext-line:#EAD98A;\n  --fn-fwd:#4A1160;--fn-fwd-soft:#E9D2FF;--fn-fwd-line:#D9B8FF;\n  --fn-vm:#0A5A2A;--fn-vm-soft:#A8F5C8;--fn-vm-line:#7FE8AB;\n  --fn-sms:#08525E;--fn-sms-soft:#9FEFFF;--fn-sms-line:#6FE0F5;\n  --fn-ai:#12308F;--fn-ai-soft:#CFE0FF;--fn-ai-line:#A8C4FF;\n}\n.fn-number{--c:var(--fn-number);--cs:var(--fn-number-soft);--cl:var(--fn-number-line);}\n.fn-ext{--c:var(--fn-ext);--cs:var(--fn-ext-soft);--cl:var(--fn-ext-line);}\n.fn-fwd{--c:var(--fn-fwd);--cs:var(--fn-fwd-soft);--cl:var(--fn-fwd-line);}\n.fn-vm{--c:var(--fn-vm);--cs:var(--fn-vm-soft);--cl:var(--fn-vm-line);}\n.fn-sms{--c:var(--fn-sms);--cs:var(--fn-sms-soft);--cl:var(--fn-sms-line);}\n.fn-ai{--c:var(--fn-ai);--cs:var(--fn-ai-soft);--cl:var(--fn-ai-line);}\n.hsteps{list-style:none;margin:0;padding:0;position:relative;container-type:inline-size;}\n/* stepper spine: continuous line through the icon column, icons sit on top */\n.hsteps::before{content:'';position:absolute;left:21px;top:26px;bottom:26px;width:2px;background:var(--line);transform:translateX(-50%);}\n.hstep{display:flex;align-items:center;position:relative;padding-bottom:20px;}\n.hstep:last-child{padding-bottom:0;}\n.hstep-ic{position:relative;z-index:1;}\n.hstep-body{display:flex;align-items:center;flex-wrap:nowrap;gap:10px;width:100%;min-width:0;}\n.hstep-title{display:flex;align-items:center;gap:11px;flex:0 1 auto;min-width:0;}\n.hstep-title b{font-size:1rem;color:var(--ink);font-weight:800;white-space:nowrap;}\n.hstep-ic{width:42px;height:42px;border-radius:12px;background:color-mix(in srgb,var(--cs,#eef) 55%,#fff);border:1px solid color-mix(in srgb,var(--cl,var(--line)) 45%,#fff);display:grid;place-items:center;flex:none;}\n.hstep-ic svg{width:22px;height:22px;color:var(--c,var(--ink));}\n.hstep-flow{display:flex;align-items:center;justify-content:flex-end;gap:9px;flex:0 1 auto;min-width:0;margin-left:auto;}\n.hstep-out{display:inline-flex;align-items:center;gap:9px;white-space:nowrap;min-width:0;}\n.hstep-res{background:#fff;color:var(--ink);border:1px solid #E7E3DA;font-weight:700;font-size:.8rem;padding:4px 10px;border-radius:100px;white-space:nowrap;flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;}\n/* narrow containers: shrink instead of overlapping - rows still never wrap */\n@container (max-width:335px){\n  .hstep-title b{font-size:.9rem;}\n  .hstep-ic{width:36px;height:36px;border-radius:10px;}\n  .hstep-ic svg{width:19px;height:19px;}\n  .hstep-res{font-size:.72rem;padding:3px 8px;}\n  .hstep-title{gap:9px;}\n  .hstep-body{gap:8px;}\n  .hsteps::before{left:18px;}\n}\n@container (max-width:295px){\n  .hstep-title b{font-size:.82rem;}\n  .hstep-ic{width:32px;height:32px;}\n  .hstep-ic svg{width:17px;height:17px;}\n  .hstep-res{font-size:.68rem;}\n}\n/* generic pieces for reusing the palette on other components */\n.fn-chip{display:inline-flex;align-items:center;gap:7px;background:var(--cs,var(--accent-soft));color:var(--c,var(--accent-text));font-weight:700;font-size:.85rem;padding:5px 12px;border-radius:100px;white-space:nowrap;}\n.fn-chip svg{width:15px;height:15px;color:var(--c,var(--accent-text));flex:none;}\n.fn-tile{width:42px;height:42px;border-radius:12px;background:var(--cs,var(--accent-soft));display:grid;place-items:center;flex:none;}\n.fn-tile svg{width:22px;height:22px;color:var(--c,var(--accent-text));}\n\n/* card wrapper so the function list can drop into any page's \"How it works\" section as-is */\n.fnlist-card{max-width:560px;margin:0 auto;background:#F7F7F8;border:1px solid var(--line);border-radius:24px;padding:28px;}\n@media(max-width:620px){.fnlist-card{padding:18px 14px;}}\n\n/* grid variant: full-width section row layout (not a hero copy) - 2-col tiles, no stepper spine */\n.fnlist-card.grid{max-width:940px;background:transparent;border:none;padding:0;}\n.hsteps.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}\n.hsteps.grid::before{display:none;}\n.hsteps.grid .hstep{min-width:0;padding-bottom:0;background:#fff;border:1px solid var(--cl,var(--line));border-radius:16px;padding:18px 20px;}\n.hsteps.grid .hstep-body{gap:12px;}\n@media(max-width:720px){.hsteps.grid{grid-template-columns:1fr;}}\n\n<\u002Fstyle>\n<style>\n  *{margin:0;padding:0;box-sizing:border-box;}\n  :root{\n    --ink:#131316;--body:#3c4147;--muted:#838995;--line:#E8EAEE;--soft:#F1F3F6;--bg:#FFFFFF;\n    --accent:#131316;--accent-dark:#33333A;--neon:#A2FBEF;--beige:#F4F2ED;--cta:#5158E2;--cta-soft:#ECEDFC;--cta-dark:#3E45C7;--accent-soft:#F1F1F0;\n    --green:#1bb56a;--green-soft:#ecfdf3;--green-ink:#0f7a47;\n    --warn:#c0492b;--warn-soft:#fdeeea;\n    --gold:#f5a623;\n    --sans:'Plus Jakarta Sans',system-ui,sans-serif;\n  }\n  html{scroll-behavior:smooth;}\n  body{font-family:var(--sans);color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;line-height:1.5;}\n  .wrap{max-width:1140px;margin:0 auto;padding:0 32px;}\n  a{color:inherit;}\n  .reveal{opacity:0;transform:translateY(16px);transition:opacity .6s ease,transform .6s ease;} .reveal.in{opacity:1;transform:none;}\n\n  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;font-weight:700;text-decoration:none;border-radius:11px;font-size:1rem;cursor:pointer;transition:transform .15s,background .15s,box-shadow .15s,border-color .15s;border:1.5px solid transparent;font-family:var(--sans);}\n  .btn:hover{transform:translateY(-1px);}\n  .btn-primary{background:var(--cta);color:#fff;border-color:var(--cta);border-width:1px;padding:13px 22px;}\n  .btn-primary:hover{background:var(--cta-dark);color:#fff;}\n  .btn-ghost{background:#fff;border-color:var(--line);color:var(--ink);padding:12px 22px;}\n  .btn-ghost:hover{border-color:var(--ink);}\n  .btn-lg{padding:15px 28px;font-size:1rem;min-width:206px;}\n  .btn-arrow svg{width:18px;height:18px;transition:transform .18s;}\n  .btn-arrow:hover svg{transform:translateX(3px);}\n\n  /* header */\n  header.lp{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}\n  .lp-inner{display:flex;align-items:center;justify-content:space-between;height:76px;}\n  .logo{font-size:1.72rem;}\n  .hdr-right{display:flex;align-items:center;gap:18px;}\n  .hdr-cta{background:var(--cta);color:#fff;padding:11px 20px;border-radius:10px;font-weight:700;text-decoration:none;font-size:.92rem;}\n  .hdr-cta:hover{background:var(--cta-dark);}\n\n  /* hero */\n  .hero{padding:24px 0 50px;background:linear-gradient(180deg,#F4F5FC 0%,#fff 78%);}\n  .hero-grid{display:grid;grid-template-columns:1.04fr .96fr;gap:56px;align-items:center;}\n  .eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--cta-soft);color:var(--cta-dark);font-weight:800;font-size:.9rem;letter-spacing:.005em;text-transform:uppercase;padding:7px 13px;border-radius:8px;margin-bottom:20px;}\n  .hero-kick{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;}\n  .hero-kick .eyebrow{display:inline-flex;width:auto;max-width:100%;margin:0;}\n  .hero-kick .nup-stamp{margin:0;}\n  .hero h1{font-weight:600;font-size:clamp(2.1rem,3.9vw,3rem);line-height:1.06;letter-spacing:-.035em;margin-bottom:14px;text-wrap:pretty;}\n  .hero h1 .u{color:inherit;}\n  .hero-sub{font-size:1.1rem;line-height:1.5;color:var(--body);max-width:40ch;margin-bottom:20px;font-weight:500;}\n  .hero-acts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:20px;}\n  .hero-bullets{list-style:none;display:flex;flex-direction:column;gap:12px;}\n  .hero-bullets li{text-wrap:pretty;display:flex;align-items:flex-start;gap:11px;font-size:1.02rem;font-weight:600;color:var(--ink);}\n  .hero-bullets .ck{width:24px;height:24px;color:#131316;display:grid;pl
